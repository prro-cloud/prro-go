# OpenAPI contract of prro-service's PUBLIC machine API — what an integrator
# writes against, and the only half of the service that is published. It
# leaves the server as it is: the landing serves this exact file at
# /api/openapi.yaml, so nothing may enter it that we would not hand a
# stranger.
#
# Its sibling api/internal.yaml describes the cabinet, the operator zone and
# the logins behind them; the panel (web-spa) generates its TypeScript client
# from that one. The split is by tag — system, fiscal, billing and webhooks
# here, cabinet/operator/cabinet-auth/auth there — and it is the same line the
# runtime draws: this half answers on the public listener, that one on
# CABINET_ADDR (docs/api-split-plan.md).
#
# Components both halves need live HERE and are reached from internal.yaml by
# an external $ref, so this file never depends on that one and always stands
# alone. Grows stage by stage together with the backend
# (docs/prro-service-plan.md).
#
# Every rendered field — summary, description, prose examples — is written in
# Ukrainian: this file generates the integrator-facing documentation, and the
# service already speaks Ukrainian everywhere a client can hear it
# (faults.Localize and apiv1.Lang both fall back to "uk"). These "#" comments
# are the other audience — whoever edits the contract — and stay English with
# the rest of the code.
#
# House style of the rendered text, kept as it is on every later edit:
#
#   1. summary is ONE short line — a noun phrase or an imperative, never a
#      ">-" block, never a parenthesis carrying mechanics. If it does not
#      fit, the overflow is a description, not a longer summary.
#   2. description states the rule and its limits: shape, constraints,
#      defaults, what fails and with which status, where the caller gets the
#      value. Nothing else.
#   3. Why we settled on something — history, alternatives rejected, how it
#      is implemented, which transaction writes it — belongs in these "#"
#      comments, never in a rendered field.
#   4. Register of a reference manual: neutral, factual, no metaphors, no
#      anthropomorphism ("лічильник живе", "період з'їв"), no guessing at
#      what the reader is trying to do.
#   5. Nothing internal is nameable here: not the operational CLI, not the
#      cabinet's or operator's internals, not infrastructure (KEK, NATS,
#      the database). Components shared with internal.yaml are phrased so
#      they read correctly for both audiences.
#   6. Only /v1 exists in this document, and now in the runtime too — the
#      prefix the API answered on before it was removed in 2026-09.
#   7. The prose follows ASD-STE100 (Simplified Technical English) as far as
#      Ukrainian allows: short sentences with one statement each, the active
#      voice with a named actor (сервіс, ДПС, клієнт), Markdown lists instead
#      of ";"-chains for enum values, and ONE word per meaning — no synonyms.
#      The vocabulary is fixed; use these words and only these:
#        - каса — never реєстратор or ПРРО (ПРРО stays only in the
#          definition in info.description and the printed label «ФН ПРРО»);
#        - чек — a sale/return/storno/service_in/service_out document
#          (never розрахунковий документ); документ — any document sent to
#          ДПС (чек, Z-звіт, shift and offline-session documents);
#        - продаж (not реалізація), службова видача (not інкасація), сторно
#          as the noun and скасувати as the verb (not сторнувати),
#          початковий чек (not оригінал);
#        - ДПС (not фіскальний сервер); надіслати (not передати/подати);
#          ДПС отримує / відхиляє; помилка (not збій/відмова);
#        - відмова — only for abandoning an offline session; закрити — a
#          shift or an offline session; завершитися — only a task;
#        - залишок готівки (not лічильник готівки); лічильник — only
#          лічильник локальних номерів;
#        - примітка (not коментар), позиція (not рядок чека), оплата;
#        - вебхук (not точка доставки), приймач; доставка — only a webhook
#          delivery; sync/async is режим відповіді;
#        - призупинити / відновити; звіряння — only against ДПС
#          (sync_register), перевірка — everything else;
#        - результат (not вердикт); кабінет (not панель); клієнт (not
#          інтеграція); господарська одиниця (not точка продажу); запит
#          (not виклик); строк дії закінчується (not спливає/протермінований);
#        - сервіс створює документ, ДПС присвоює номер; тестовий / фіскальний
#          режим каси; автоматичне виправлення (not усунення);
#        - field presence is "Поле є лише ..." / "Поля немає, якщо ...".
#
# info.version is maintained from 2026-07-19 on, semver over the contract
# itself and nothing else (not the service build, which carries its own
# version): patch for wording, minor for anything additive, major for a
# change that breaks an existing client. It restarts at 0.1.0 here because
# the number it replaces had sat untouched since the scaffold and meant
# nothing. Bump it in the same commit that changes the contract.
openapi: 3.1.0
info:
  title: prro-service API
  description: >-
    REST API сервісу фіскалізації. Шляхи вказано від базової адреси.


    Каса — програмний реєстратор розрахункових операцій (ПРРО). Документ —
    будь-який документ, який сервіс надсилає до ДПС: чек, Z-звіт, документ
    зміни, документ офлайн-сесії. Чек — документ типу sale, return, storno,
    service_in або service_out.


    Автентифікація: Bearer JWT. Токен створюють у кабінеті. Цей документ не
    описує вхід у кабінет.


    Тіло запиту містить лише поля, які описує цей документ. Сервіс ігнорує
    невідоме поле на будь-якому рівні. Заголовок відповіді X-Unknown-Fields
    містить шляхи всіх невідомих полів через кому. Приклад: discount,
    items[0].unit. Заголовка немає, якщо невідомих полів немає.
  version: 0.10.0

paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Версія збірки сервісу
      tags: [system]
      responses:
        "200":
          description: Версія збірки.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    description: >-
                      Тег збірки: dev для локальної збірки, номер версії для
                      релізу.
                    type: string
                    examples: ["dev", "v0.3.0"]

  /v1/whoami:
    get:
      operationId: whoami
      summary: Клієнт і дозволи токена
      tags: [system]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Клієнт, дозволи (scopes) і каси токена.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, scopes, jti, all_cash_registers]
                properties:
                  client_id:
                    type: string
                    format: uuid
                    description: Клієнт, від імені якого діє токен.
                  scopes:
                    description: Дозволи токена.
                    type: array
                    items: { type: string }
                  all_cash_registers:
                    type: boolean
                    description: >-
                      true: токен необмежений, він діє на всі каси клієнта,
                      поточні й майбутні. false: токен обмежений, він діє лише
                      на каси з cash_registers.
                  cash_registers:
                    type: array
                    description: >-
                      Перелік uuid кас, на які діє обмежений токен. Поля немає,
                      якщо all_cash_registers = true.
                    items: { type: string, format: uuid }
                  jti:
                    type: string
                    format: uuid
                    description: >-
                      Ідентифікатор токена. За цим ідентифікатором токен
                      відкликають у кабінеті.
                  expires_at:
                    type: string
                    format: date-time
                    description: >-
                      Час, коли строк дії токена закінчується. Поля немає, якщо
                      токен безстроковий.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/receipts:
    post:
      operationId: createReceipt
      summary: Зареєструвати чек
      description: |-
        Типи чеків:

        - `sale` — продаж
        - `return` — повернення
        - `storno` — сторно попереднього чека
        - `service_in` — службове внесення
        - `service_out` — службова видача

        Сервіс виконує повний фіскальний цикл. Сервіс присвоює локальний номер,
        створює XML за схемою check01 і підписує його КЕП (CAdES-T). Потім
        сервіс надсилає документ до ДПС і отримує квитанцію.

        Режим відповіді `sync` (типовий) чекає на результат до 30 секунд. Якщо
        за цей час результату немає, сервіс повертає 202 і завдання. Режим
        `async` повертає 202 одразу.

        Заголовок Idempotency-Key обов'язковий. Повторний запит із тим самим
        ключем повертає те саме завдання. Сервіс не реєструє другий чек.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptInput" }
      responses:
        "201":
          description: >-
            Чек зареєстровано. Завдання завершилося успішно за час очікування
            режиму sync.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "200":
          description: >-
            Повторний запит із тим самим Idempotency-Key. Завдання вже
            завершилося.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "202":
          description: >-
            Завдання ще виконується. Статус завдання: GET /v1/tasks/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: >-
            Баланс нижчий за поріг. Сервіс відхиляє нові чеки, доки клієнт не
            поповнить баланс. Операції зі змінами доступні.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Цей Idempotency-Key уже використано для іншої операції.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            Запит не пройшов валідацію, або завдання завершилося помилкою.
            Приклади: немає відкритої зміни, ДПС відхилила документ.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Статус і результат завдання
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор завдання з відповіді на фіскальну операцію.
      responses:
        "200":
          description: Завдання в поточному стані.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/cash-registers:
    get:
      operationId: listCashRegistersForToken
      summary: Каси, доступні токену
      description: >-
        Для необмеженого токена сервіс повертає всі каси клієнта. Для
        обмеженого токена сервіс повертає лише каси цього токена. Значення id
        використовують як cash_register_id і як {id} в інших маршрутах.
        Поточний стан каси: GET /v1/cash-registers/{id}.
      tags: [fiscal]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Каси токена, від найстарішої.
          content:
            application/json:
              schema:
                type: object
                required: [cash_registers]
                properties:
                  cash_registers:
                    description: Каси токена, від найстарішої.
                    type: array
                    items: { $ref: "#/components/schemas/CashRegisterListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/cash-registers/{id}:
    get:
      operationId: getCashRegisterState
      summary: Стан каси
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
      responses:
        "200":
          description: Поточний стан каси.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashRegisterState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/shifts:
    post:
      operationId: openShift
      summary: Відкрити зміну
      description: >-
        Завдання, режим відповіді та Idempotency-Key працюють так само, як у
        POST /v1/receipts.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cashier:
                  type: string
                  description: >-
                    Ім'я касира. Сервіс друкує його в документі відкриття зміни.
                mode:
                  type: string
                  enum: [sync, async]
                  default: sync
                  description: >-
                    Режим відповіді. Параметр запиту ?mode= має пріоритет над
                    цим полем.
      responses:
        "201":
          description: Зміну відкрито.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "202":
          description: >-
            Завдання ще виконується. Статус завдання: GET /v1/tasks/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/shifts/current:
    delete:
      operationId: closeShift
      summary: Закрити поточну зміну
      description: >-
        Операція створює Z-звіт і документ закриття зміни.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Mode"
      responses:
        "201":
          description: >-
            Зміну закрито. Результат містить Z-звіт і документ закриття зміни.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "202":
          description: >-
            Завдання ще виконується. Статус завдання: GET /v1/tasks/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/offline-session/close:
    post:
      operationId: closeOfflineSession
      summary: Надіслати й закрити офлайн-сесію зараз
      description: >-
        Сервіс надсилає пакети офлайн-сесії до ДПС і закриває сесію. Сервіс не
        чекає на фонове надсилання. Каса повертається в онлайн-режим, лише
        коли ДПС отримала всі документи сесії.


        Якщо ДПС недоступна, сервіс відхиляє операцію з кодом
        state.offline_close_needs_dps. У цьому випадку сервіс надсилає й
        закриває сесію автоматично, коли ДПС знову доступна.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cashier:
                  type: string
                  description: >-
                    Ім'я касира. Сервіс друкує його в документі закриття
                    офлайн-сесії.
                mode:
                  type: string
                  enum: [sync, async]
                  default: sync
                  description: >-
                    Режим відповіді. Параметр запиту ?mode= має пріоритет над
                    цим полем.
      responses:
        "201":
          description: >-
            Офлайн-сесію закрито. Результат містить документ закриття
            офлайн-сесії.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "202":
          description: >-
            Завдання ще виконується. Статус завдання: GET /v1/tasks/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/offline-session/retry:
    post:
      operationId: retryOfflineSubmission
      summary: Відновити надсилання офлайн-пакетів
      description: >-
        Сервіс призупиняє надсилання, коли ДПС відхиляє пакет офлайн-сесії.
        Спочатку виправте причину. Потім надішліть запит на цей маршрут. Якщо
        ДПС відхиляє сесію постійно, відмовтеся від сесії через POST
        .../offline-session/abandon.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
      responses:
        "200":
          description: Кількість офлайн-сесій, для яких сервіс відновив надсилання.
          content:
            application/json:
              schema:
                type: object
                required: [resumed_sessions]
                properties:
                  resumed_sessions:
                    type: integer
                    description: >-
                      Кількість офлайн-сесій, для яких сервіс відновив
                      надсилання. 0: призупинених сесій не було.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/offline-session/abandon:
    post:
      operationId: abandonOfflineSession
      summary: Відмовитися від офлайн-сесії, яку відхиляє ДПС
      description: |-
        Операція доступна, лише коли виконано обидві умови:

        - надсилання сесії призупинено (state.offline_backlog_undeliverable)
        - ДПС доступна

        Інакше сервіс повертає помилку state.offline_session_not_paused або
        state.offline_abandon_needs_dps.

        Сервіс позначає статусом abandoned документи сесії, яких ДПС не
        отримала. Офлайн-фіскальних номерів цих документів у ДПС немає. Їхні
        локальні номери отримують наступні документи. Сервіс закриває сесію в
        ДПС із документами, які ДПС уже отримала. Каса отримує нові
        офлайн-ключі.

        Перелік документів зі статусом abandoned є в результаті завдання і в
        події register.offline_abandoned. Клієнт вирішує, чи реєструвати ці
        чеки знову.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [sync, async]
                  default: sync
                  description: >-
                    Режим відповіді. Параметр запиту ?mode= має пріоритет над
                    цим полем.
      responses:
        "201":
          description: >-
            Від офлайн-сесії відмовилися. Результат містить offline_abandon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "202":
          description: >-
            Завдання ще виконується. Статус завдання: GET /v1/tasks/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/attention:
    delete:
      operationId: clearRegisterAttention
      summary: Зняти позначку «потребує уваги» з каси
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
      responses:
        "200":
          description: Чи зняв сервіс позначку.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean, description: "false: позначки не було." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/cash-registers/{id}/cash-balance:
    put:
      operationId: setCashBalance
      # Why a declaration rather than a fiscal document: filing a службове
      # внесення for money that was already in the drawer would be wrong twice
      # over — it did not enter today, and it would inflate SERVICEINPUT in the
      # shift's Z-report.
      summary: Заявити фактичний залишок готівки
      description: >-
        Операція встановлює залишок готівки, який перерахували в касі.
        Операцію використовують, коли касу підключили з готівкою в касовому
        ящику або коли залишок готівки не збігається з фактичним.


        Операція не фіскальна. Заявлений залишок готівки не потрапляє в
        документи і не змінює підсумків зміни. Рух готівки реєструють чеками
        service_in і service_out. Для від'ємної суми сервіс повертає 422.
      tags: [fiscal]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор каси з GET /v1/cash-registers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  allOf:
                    - $ref: "#/components/schemas/CashAmount"
                  description: >-
                    Перерахований залишок готівки. Від'ємне значення не
                    допускається.
      responses:
        "200":
          description: Залишок готівки після заяви.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashBalanceDeclaration" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/billing/usage:
    get:
      operationId: billingUsage
      summary: Передплачений баланс і підсумок тарифікації за період
      description: >-
        Суми — копійки десятковим рядком. Типовий період — поточний
        календарний місяць за UTC. Дата `to` не входить у період. Для періоду
        понад 366 днів сервіс повертає 422.


        Сервіс тарифікує чеки асинхронно. Тому підсумок може не містити чеків
        за останні кілька секунд.
      tags: [billing]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: >-
            Початок періоду, дата за UTC. Дата входить у період. Типово — перше
            число поточного місяця.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: >-
            Кінець періоду. Дата не входить у період. Типово — перше число
            наступного місяця. Для періоду понад 366 днів сервіс повертає 422.
      responses:
        "200":
          description: Баланс і підсумок тарифікації за період.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/invoices:
    get:
      operationId: listInvoices
      summary: Рахунки клієнта, від найновішого періоду
      description: >-
        Один рахунок відповідає одному розрахунковому періоду, а не одному
        платежу.
      tags: [billing]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: >-
            Кількість рахунків у відповіді: 1–200, типово 50.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: >-
            Кількість рахунків, які сервіс пропускає. Параметр використовують
            для посторінкового читання.
      responses:
        "200":
          description: Рахунки клієнта.
          content:
            application/json:
              schema:
                type: object
                required: [invoices]
                properties:
                  invoices:
                    description: Рахунки, від найновішого періоду.
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/webhooks:
    get:
      operationId: listWebhooks
      summary: Вебхуки клієнта без секретів
      tags: [webhooks]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Вебхуки клієнта.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, limit, used]
                properties:
                  webhooks:
                    description: Вебхуки клієнта. Відповідь не містить секретів.
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
                  limit:
                    type: integer
                    description: >-
                      Максимальна кількість вебхуків: кількість кас клієнта
                      плюс один.
                  used:
                    type: integer
                    description: >-
                      Кількість зареєстрованих вебхуків, разом із
                      призупиненими.
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createWebhook
      summary: Зареєструвати вебхук
      description: >-
        Сервіс доставляє подію запитом POST. Тіло запиту: {delivery_id, event,
        attempt, sequence, occurred_at, data}. Заголовок X-Signature має
        вигляд "sha256=<HMAC-SHA256 тіла у hex>". Сервіс обчислює підпис із
        секретом цього вебхука.


        Сервіс гарантує доставку «щонайменше один раз». Приймач має
        відкидати повторні доставки за delivery_id.


        Сервіс доставляє події однієї каси по одній і за порядком. Якщо
        приймач не прийняв подію, сервіс доставляє наступні події без
        затримки. Після повторної спроби або replay ця подія може надійти
        пізніше за наступні. Упорядковуйте події каси за sequence. sequence —
        номер події в межах каси. Номер зростає, але може мати пропуски.
        Поточний стан каси: GET /v1/cash-registers/{id}.
      tags: [webhooks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "Абсолютний http(s)-URL приймача." }
                events:
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                  description: >-
                    Події, на які підписано вебхук. Порожній список означає всі
                    події. Якщо поля немає, вебхук підписано на всі події.
                secret: { type: string, description: "Секрет HMAC. Якщо поля немає, сервіс створює секрет." }
      responses:
        "201":
          description: Вебхук створено. Сервіс повертає секрет лише один раз.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WebhookEndpoint"
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string, description: "Сервіс не повертає секрет повторно." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            Кількість вебхуків досягла максимуму (код webhook_limit_reached).
            Максимум — кількість кас клієнта плюс один. Призупинені вебхуки
            входять у цю кількість. Поле details містить limit і used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Ідентифікатор вебхука.
    patch:
      operationId: updateWebhook
      summary: Змінити URL, події або активність вебхука
      tags: [webhooks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, description: "Новий абсолютний http(s)-URL приймача." }
                events:
                  description: Новий перелік подій. Порожній список означає всі події.
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                active: { type: boolean, description: "false: сервіс призупиняє доставку. Черга доставок зберігається." }
      responses:
        "200":
          description: Вебхук змінено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      summary: Видалити вебхук
      tags: [webhooks]
      security:
        - bearerAuth: []
      responses:
        "204": { description: "Вебхук видалено. Сервіс переводить недоставлені події в статус dead." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: Історія доставок вебхука
      description: >-
        Сервіс зберігає доставки зі статусом delivered 30 днів, доставки зі
        статусом dead — 14 днів від останньої спроби. Потім сервіс видаляє
        доставки з історії.
      tags: [webhooks]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор вебхука.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivering, delivered, failed, dead]
          description: Лише доставки з цим статусом.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: >-
            Кількість доставок у відповіді: 1–200, типово 50.
      responses:
        "200":
          description: Доставки.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    description: Доставки, від найновішої.
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/webhooks/{id}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: Повторити доставку
      description: >-
        Сервіс повертає доставку в чергу з новою кількістю спроб. Зазвичай це
        доставка зі статусом dead. Операція доступна, поки доставка є в
        історії. Доставка зі статусом dead є в історії 14 днів від останньої
        спроби.
      tags: [webhooks]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор вебхука.
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Ідентифікатор доставки з історії.
      responses:
        "200":
          description: >-
            Доставку повернуто в чергу. Сервіс виконує спробу одразу. Сервіс не
            повторює події, які доставив за цей час. Ця подія надійде після
            них.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Спроба доставки виконується зараз.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/system/dps:
    get:
      operationId: systemDPSStatus
      summary: Поточний режим роботи з ДПС (онлайн/офлайн)
      description: >-
        Режим, у якому сервіс працює з ДПС зараз. Маршрут доступний для
        будь-якого машинного токена.
      tags: [system]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Режим роботи з ДПС і телеметрія, яка пояснює цей режим.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DPSPulse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Машинний JWT із довгим строком дії. Токен створюють у кабінеті.
        Необмежений токен діє на всі каси клієнта, поточні й майбутні.


        Обмежений токен діє лише на каси зі свого переліку. Для інших кас
        операції з касою повертають 404, і сервіс не повідомляє, чи існує
        каса. Ресурси рівня клієнта (тарифікація, вебхуки) повертають 403.
  parameters:
    Mode:
      name: mode
      in: query
      required: false
      schema: { type: string, enum: [sync, async] }
      description: >-
        Режим відповіді. Параметр має пріоритет над полем mode у тілі запиту.
        `sync` (типовий) чекає на результат до 30 секунд. `async` одразу
        повертає 202 і завдання.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: >-
        Ключ операції. Значення ключа обирає клієнт. Повторний запит із тим
        самим ключем повертає початкове завдання. Сервіс не виконує фіскальну
        операцію вдруге.

  responses:
    Error:
      description: Конверт помилки.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >-
        Токена немає, токен недійсний, строк дії токена закінчився або токен
        відкликано.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      description: >-
        Конверт помилки: машинний код, текст для людини і подробиці, якщо
        вони є.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [unauthorized, validation_failed]
          description: >-
            Стабільний машинний код помилки. Програма клієнта обробляє помилку
            за цим кодом.
        message:
          type: string
          description: >-
            Текст для людини. Не використовуйте цей текст у логіці програми.
        details:
          description: >-
            Подробиці помилки, якщо вони є. Приклад: перелік полів, які не
            пройшли валідацію.

    CashRegisterState:
      description: >-
        Поточний стан каси: режим, зміна, залишок готівки, офлайн-сесія.
      type: object
      required: [id, fiscal_number, local_number, mode, state, offline_limits]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Ідентифікатор каси в цьому API. Це те саме значення, що
            cash_register_id у запиті на чек.
        fiscal_number:
          type: string
          description: >-
            Фіскальний номер каси, який присвоїла ДПС. У чеку це «ФН ПРРО».
        local_number: { type: string, description: "CASHDESKNUM: номер каси, який присвоїв клієнт." }
        mode:
          type: string
          enum: [production, test]
          description: |-
            - `production` — фіскальний режим
            - `test` — тестовий режим, усі документи тестові

            Документи зміни мають режим, у якому зміну відкрито. Змінити режим
            можна, лише коли зміну закрито.
        state:
          type: string
          enum: [closed, opened, offline]
          description: |-
            - `closed` — зміну закрито
            - `opened` — зміну відкрито
            - `offline` — офлайн-сесія відкрита
        offline_ready:
          type: boolean
          description: >-
            Чи має каса офлайн-ключі від ДПС. ДПС надсилає офлайн-ключі разом
            із квитанцією на відкриття зміни.
        shift_mode:
          $ref: "#/components/schemas/ShiftMode"
        shift_close_times:
          $ref: "#/components/schemas/ShiftCloseTimes"
        cash_balance:
          $ref: "#/components/schemas/CashBalance"
        current_shift:
          description: Поточна зміна каси. Поля немає після закриття зміни.
          type: object
          properties:
            id: { type: string, format: uuid, description: "Ідентифікатор зміни." }
            number:
              type: integer
              format: int64
              description: >-
                Наскрізний номер зміни в межах каси («Зміна №147»). Номер
                присвоює сервіс. ДПС не присвоює номерів змін.
            status:
              type: string
              enum: [opening, opened, closing, closed]
              description: |-
                - `opening` — відкриття зміни виконується
                - `opened` — зміну відкрито
                - `closing` — закриття зміни виконується
                - `closed` — зміну закрито
            testing:
              type: boolean
              description: >-
                Зміну відкрито в тестовому режимі каси. Усі документи зміни
                тестові.
            opened_at: { type: string, format: date-time, description: "Час відкриття зміни." }
            documents:
              type: integer
              description: >-
                Кількість документів зміни всіх типів, не лише чеків. Поля
                немає, якщо сервіс не зміг підрахувати документи.
        shift_totals:
          $ref: "#/components/schemas/ShiftTotals"
        offline_session:
          type: object
          description: Поле є лише тоді, коли офлайн-сесія відкрита.
          properties:
            id: { type: string, format: uuid, description: "Ідентифікатор офлайн-сесії в сервісі." }
            dps_session_id:
              type: integer
              format: int64
              description: >-
                Номер офлайн-сесії, який присвоїла ДПС. Номер входить у
                фіскальний номер офлайн-документа.
            started_at:
              type: string
              format: date-time
              description: >-
                Час відкриття офлайн-сесії. Від цього часу сервіс рахує межу 36
                годин.
            documents:
              type: integer
              format: int64
              description: Кількість документів, які сервіс створив у цій офлайн-сесії.
            last_significant_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                Час останнього документа, який продовжує офлайн-сесію. За цим
                часом сервіс рахує використаний місячний час.
            submit_paused_at:
              type: string
              format: date-time
              description: >-
                Час, коли сервіс призупинив надсилання офлайн-пакетів, бо ДПС
                відхилила пакет. Поле є лише тоді, коли надсилання
                призупинено.
            submit_fault:
              allOf:
                - $ref: "#/components/schemas/Fault"
              description: >-
                Помилка, з якою ДПС відхилила офлайн-пакет. Поле є лише тоді,
                коли надсилання призупинено.
        offline_limits:
          type: object
          description: >-
            Законодавчі межі офлайн-режиму в секундах: 36 годин на одну
            офлайн-сесію і 168 годин на календарний місяць. Використаний час
            рахують від offline_session.started_at або від restored_at, якщо
            він пізніший, і за offline_month_used_seconds.
          required: [session_seconds, month_seconds, enforced]
          properties:
            session_seconds:
              type: integer
              format: int64
              description: Межа однієї офлайн-сесії, 36 годин у секундах.
            month_seconds:
              type: integer
              format: int64
              description: Межа на календарний місяць, 168 годин у секундах.
            enforced:
              type: boolean
              description: >-
                Межі діють. Значення false: межі знято за пунктом 13 розділу
                «Прикінцеві положення» Закону № 265. Сервіс рахує час в
                офлайн-режимі, але не відхиляє документи через межі.
            restored_at:
              type: string
              format: date-time
              description: >-
                Час, коли межі повернули після зняття. Сервіс рахує межі від
                цього часу, якщо він пізніший за початок офлайн-сесії або
                місяця. Поля немає, якщо межі не знімали.
        offline_month_used_seconds:
          type: integer
          format: int64
          description: >-
            Час в офлайн-режимі за поточний календарний місяць, у секундах.
            Сервіс рахує місяць за київським часом.
        attention:
          type: object
          description: >-
            Поле є лише тоді, коли каса має позначку «потребує уваги». Зняти
            позначку: DELETE .../attention. Якщо надсилання офлайн-пакетів
            призупинено, відновіть його через POST .../offline-session/retry.
          required: [reason]
          properties:
            reason:
              description: |-
                - `recurring_remediation` — сервіс виправляє розбіжності з ДПС
                  знову і знову
                - `offline_submission_paused` — надсилання офлайн-пакетів
                  призупинено
                - `auto_close_failing` — автоматичне закриття зміни
                  завершується помилкою
              type: string
              enum: [recurring_remediation, offline_submission_paused, auto_close_failing]
            since:
              type: string
              format: date-time
              nullable: true
              description: Час, коли сервіс поставив позначку.

    ShiftMode:
      type: string
      enum: [manual, round_the_clock, working_hours]
      description: |-
        Як сервіс керує змінами каси:

        - `manual` — клієнт відкриває і закриває зміни сам.
        - `round_the_clock` — сервіс закриває зміну в кожен час із
          shift_close_times. Наступний чек відкриває нову зміну.
        - `working_hours` — денне вікно між двома значеннями
          shift_close_times.

        `round_the_clock` і `working_hours` — автоматичні режими змін. В
        автоматичному режимі змін перший чек відкриває зміну.
    ShiftCloseTimes:
      type: array
      items:
        type: string
        pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: >-
        Час щоденного закриття зміни за київським часом. Масив порожній лише
        тоді, коли shift_mode — `manual`. Час прив'язано до годинника, а не
        до часу відкриття зміни.


        Масив містить щонайменше два значення. Проміжок між сусідніми
        значеннями — не більше 20 годин, також через північ. Для
        `round_the_clock` — два або більше значень у порядку зростання. Для
        `working_hours` — рівно два значення: початок і кінець дня, у цьому
        порядку. Приклад вікна через північ: "08:00", потім "02:00".
      example: ["09:00", "21:00"]

    CashRegisterListItem:
      type: object
      description: >-
        Каса в переліку: ідентифікатор для запитів і реквізити, за якими
        людина впізнає касу.
      required: [id, fiscal_number, local_number, mode, state]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Ідентифікатор каси в цьому API. Значення використовують як
            cash_register_id у запиті на чек і як {id} в інших маршрутах.
        fiscal_number:
          type: string
          description: >-
            Фіскальний номер каси, який присвоїла ДПС.
        local_number: { type: string, description: "CASHDESKNUM: номер каси, який присвоїв клієнт." }
        org_name: { type: string, description: "Назва суб'єкта господарювання." }
        point_name: { type: string, description: "Назва господарської одиниці." }
        point_address: { type: string, description: "Адреса господарської одиниці." }
        mode:
          type: string
          enum: [production, test]
          description: |-
            - `production` — фіскальний режим
            - `test` — тестовий режим, усі документи тестові

            Документи зміни мають режим, у якому зміну відкрито. Змінити режим
            можна, лише коли зміну закрито.
        state:
          type: string
          enum: [closed, opened, offline]
          description: |-
            - `closed` — зміну закрито
            - `opened` — зміну відкрито
            - `offline` — офлайн-сесія відкрита

    Task:
      description: >-
        Завдання фіскального конвеєра. Кожен запит до ДПС сервіс виконує як
        завдання.
      type: object
      required: [task_id, type, status, created_at]
      properties:
        task_id:
          type: string
          format: uuid
          description: >-
            Ідентифікатор завдання. Статус завдання: GET /v1/tasks/{id}.
        type:
          type: string
          enum: [receipt, open_shift, close_shift, close_offline_session, abandon_offline_session, verify_key, sync_register, dps_objects]
          description: |-
            Операція завдання:

            - `receipt` — чек
            - `open_shift` — відкриття зміни
            - `close_shift` — закриття зміни
            - `close_offline_session` — закриття офлайн-сесії
            - `abandon_offline_session` — відмова від офлайн-сесії, яку
              відхиляє ДПС
            - `verify_key` — перевірка ключа КЕП
            - `sync_register` — звіряння каси з ДПС
            - `dps_objects` — запит господарських одиниць власника ключа
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
          description: |-
            - `pending` — завдання в черзі
            - `processing` — завдання виконується
            - `succeeded` — завдання завершилося успішно, дані в result
            - `failed` — завдання завершилося помилкою, дані в fault
        created_at: { type: string, format: date-time, description: "Час створення завдання." }
        finished_at:
          type: string
          format: date-time
          description: >-
            Час завершення завдання. Поля немає, поки завдання виконується.
        error:
          type: string
          description: >-
            Текст помилки завдання. Структурований опис цієї помилки — у полі
            fault.
        fault: { $ref: "#/components/schemas/Fault" }
        result: { $ref: "#/components/schemas/TaskResult" }

    Fault:
      type: object
      description: |-
        Структурований опис помилки завдання. Мову message визначає заголовок
        Accept-Language. Типова мова — українська.

        Простори імен коду:

        - `dps.*` — помилка ДПС
        - `fiscal.*` — валідація документа
        - `return.*` — перевірка повернення за початковим чеком
        - `storno.*` — перевірка сторно за чеком, який сторно скасовує
        - `signer.*` — помилка КЕП
        - `state.*` — стан каси
      required: [code, class]
      properties:
        code:
          type: string
          description: >-
            Стабільний ідентифікатор помилки. Приклад:
            dps.check_local_number_invalid.
        class:
          type: string
          enum: [resync, config, precursor, user_action, transient, request, internal]
          description: |-
            Дія, яка може виправити помилку:

            - `resync` — звірити стан каси з ДПС
            - `config` — виправити налаштування каси
            - `precursor` — виконати пропущений попередній крок
            - `user_action` — потрібне рішення людини
            - `transient` — тимчасова недоступність, повторіть запит
            - `request` — виправити запит
            - `internal` — внутрішня помилка сервісу
        params:
          description: Значення для підстановки в message.
          type: object
          additionalProperties: true
        message:
          type: string
          description: >-
            Текст для людини з каталогу помилок, перекладений мовою з
            Accept-Language.
        upstream_message:
          type: string
          description: Текст помилки від ДПС без змін.
        remediation:
          type: array
          items:
            type: string
            enum: [local_number_synced, shift_adopted, shift_abandoned, zreport_recovered, zreport_autofiled, register_config_filled]
          description: >-
            Автоматичні виправлення, які сервіс виконав під час завдання.

    TaskResult:
      type: object
      description: >-
        Фіскальні поля (prro_id, shift_id, testing та інші) є в результаті
        завдань на чек, зміну та офлайн-сесію. Завдання verify_key повертає
        лише key_verification.
      properties:
        prro_id: { type: string, format: uuid, description: "Каса, на якій сервіс виконав завдання." }
        shift_id:
          type: string
          format: uuid
          description: Зміна, у якій сервіс створив документи завдання.
        shift_number:
          type: integer
          format: int64
          description: >-
            Наскрізний номер зміни в межах каси. Номер присвоює сервіс. ДПС не
            присвоює номерів змін, у квитанції ДПС цього поля немає.
        testing: { type: boolean, description: "Документи завдання тестові: каса в тестовому режимі." }
        receipt:
          $ref: "#/components/schemas/DocResult"
          description: Чек, який створило завдання receipt.
        shift_open:
          $ref: "#/components/schemas/DocResult"
          description: Документ відкриття зміни.
        zreport:
          $ref: "#/components/schemas/DocResult"
          description: Z-звіт, яким сервіс закрив зміну.
        shift_close:
          $ref: "#/components/schemas/DocResult"
          description: Документ закриття зміни.
        offline_end:
          $ref: "#/components/schemas/DocResult"
          description: Документ закриття офлайн-сесії.
        offline_abandon: { $ref: "#/components/schemas/OfflineAbandonResult" }
        key_verification:
          $ref: "#/components/schemas/KeyVerificationResult"
          description: >-
            Результат перевірки ключа КЕП. Це поле повертає завдання verify_key.
        key_password_check: { $ref: "#/components/schemas/KeyPasswordCheckResult" }
        reconcile: { $ref: "#/components/schemas/ReconcileReport" }
        dps_objects:
          description: >-
            Господарські одиниці власника ключа. Це поле повертає завдання
            dps_objects.
          type: array
          items: { $ref: "#/components/schemas/DPSTaxObject" }

    OfflineAbandonResult:
      type: object
      description: Результат відмови від офлайн-сесії (abandon_offline_session).
      required: [session_id, dps_session_id, held_documents, abandoned, closed]
      properties:
        session_id: { type: string, format: uuid, description: "Офлайн-сесія, від якої відмовилися." }
        dps_session_id: { type: integer, format: int64, description: "Номер офлайн-сесії, який присвоїла ДПС." }
        held_documents:
          type: integer
          format: int64
          description: >-
            Кількість документів сесії, які ДПС отримала. Ці документи
            залишаються зареєстрованими.
        abandoned:
          type: array
          items: { $ref: "#/components/schemas/AbandonedDocument" }
          description: Документи сесії, яких ДПС не отримала.
        closure_session_id:
          type: string
          format: uuid
          description: >-
            Офлайн-сесія, якою сервіс закриває в ДПС сесію, від якої
            відмовилися. Поля немає, якщо ДПС не отримала жодного документа
            сесії або ДПС уже закрила сесію сама.
        closed:
          type: boolean
          description: >-
            true: сесію закрито в ДПС, каса знову в онлайн-режимі. false:
            сервіс ще надсилає документ закриття сесії. Доти нові документи
            каси чекають у черзі.

    AbandonedDocument:
      type: object
      description: >-
        Документ офлайн-сесії, від якої відмовилися. Покупець отримав цей
        документ. Фіскального номера документа в ДПС немає.
      required: [document_id, class, local_number, created_at]
      properties:
        document_id: { type: string, format: uuid, description: "Ідентифікатор документа в журналі сервісу." }
        task_id: { type: string, format: uuid, description: "Завдання, яке створило документ." }
        class:
          type: string
          enum: [check, zreport, open_shift, close_shift, offline_begin, offline_end]
          description: Тип документа.
        kind:
          type: string
          enum: [sale, return, storno, service_in, service_out]
          description: Тип чека. Поле є лише для class = check.
        local_number:
          type: integer
          format: int64
          description: Локальний номер документа.
        fiscal_number: { type: string, description: "Офлайн-фіскальний номер, надрукований у документі." }
        total: { type: string, description: "Сума документа в гривнях. Поле є лише для чеків." }
        pay_form:
          type: string
          enum: [cash, cashless, mixed]
          description: Форма оплати. Поле є лише для чеків.
        created_at: { type: string, format: date-time, description: "Час створення документа." }

    ReconcileReport:
      type: object
      description: >-
        Результат звіряння каси з ДПС (sync_register): дані ДПС і
        виправлення, які сервіс виконав у своїх даних.
      required: [fiscal_number, dps_shift_opened, dps_next_local_number]
      properties:
        fiscal_number: { type: string, description: "Фіскальний номер каси, яку звіряли." }
        dps_shift_opened: { type: boolean, description: "Чи відкрита зміна каси за даними ДПС." }
        dps_next_local_number:
          type: integer
          format: int64
          description: Локальний номер, який ДПС очікує в наступному документі.
        dps_testing: { type: boolean, description: "Чи тестова каса за даними ДПС." }
        counter_old:
          type: integer
          format: int64
          description: Лічильник локальних номерів сервісу до звіряння.
        counter_new: { type: integer, format: int64, description: "Лічильник локальних номерів сервісу після звіряння." }
        shift_adopted:
          type: boolean
          description: Сервіс прийняв як свою зміну, відкриту в ДПС.
        shift_abandoned:
          type: boolean
          description: Сервіс закрив у своїх даних зміну, якої в ДПС немає.
        offline_credentials_refreshed:
          type: boolean
          description: Сервіс оновив офлайн-ключі каси з даних ДПС.
        cash:
          type: object
          description: >-
            Рух готівки за поточну зміну: за даними сервісу (ours) і за даними
            ДПС (dps). Поле є лише тоді, коли зміна відкрита в ДПС.


            Поле довідкове. Сервіс не виправляє розбіжність.
          required: [ours, dps, match]
          properties:
            ours: { $ref: "#/components/schemas/CashAmount" }
            dps: { $ref: "#/components/schemas/CashAmount" }
            match: { type: boolean, description: "Чи збігаються дані сервісу і дані ДПС." }
        totals:
          type: object
          description: >-
            Підсумки поточної зміни за даними сервісу і за даними ДПС. Поле є
            лише тоді, коли зміна відкрита і в ДПС, і в сервісі.


            Якщо підсумки не збігаються, сервіс надсилає Z-звіт зміни з
            підсумками ДПС. ДПС не приймає інших підсумків.
          required: [ours, match, z_report_source]
          properties:
            ours: { $ref: "#/components/schemas/ShiftTotalsBrief" }
            dps:
              $ref: "#/components/schemas/ShiftTotalsBrief"
              description: Поля немає, якщо ДПС не повернула підсумків.
            match: { type: boolean, description: "Чи збігаються підсумки сервісу і підсумки ДПС." }
            z_report_source:
              type: string
              enum: [local, dps]
              description: Джерело підсумків для Z-звіту зміни.
            forced:
              type: boolean
              description: Це звіряння перевело Z-звіт зміни на підсумки ДПС.
            held:
              type: string
              enum: [dps_totals_unavailable, shift_closing, offline_backlog]
              description: |-
                Причина, з якої сервіс не звірив підсумки або не виправив
                розбіжність:

                - `dps_totals_unavailable` — ДПС не повернула підсумків. У
                  цьому випадку match = false і поля dps немає.
                - `shift_closing` — сервіс уже надіслав Z-звіт зміни.
                - `offline_backlog` — сервіс ще не надіслав офлайн-документи
                  до ДПС.
        attention_cleared:
          type: boolean
          description: >-
            Сервіс зняв позначку auto_close_failing. Автоматичне закриття
            зміни знову працює.
        skipped:
          type: string
          enum: [offline_session]
          description: >-
            Причина, з якої сервіс не виконав звіряння. offline_session:
            сервіс не звіряє касу, коли офлайн-сесія відкрита.

    ShiftTotalsBrief:
      type: object
      description: Суми й кількості чеків зміни, за якими ДПС перевіряє Z-звіт.
      required: [sales, sales_count, returns, returns_count, service_input, service_output]
      properties:
        sales: { $ref: "#/components/schemas/CashAmount" }
        sales_count: { type: integer, description: "Кількість чеків продажу." }
        returns: { $ref: "#/components/schemas/CashAmount" }
        returns_count: { type: integer, description: "Кількість чеків повернення." }
        service_input: { $ref: "#/components/schemas/CashAmount" }
        service_output: { $ref: "#/components/schemas/CashAmount" }

    DPSTaxObject:
      type: object
      description: Господарська одиниця власника ключа (dps_objects).
      required: [name, tin, org_name, registrars]
      properties:
        name: { type: string, description: "Назва господарської одиниці." }
        address: { type: string, description: "Адреса господарської одиниці." }
        tin: { type: string, description: "Податковий номер власника: ЄДРПОУ або РНОКПП." }
        ipn: { type: string, description: "Індивідуальний податковий номер платника ПДВ." }
        org_name: { type: string, description: "Назва суб'єкта господарювання." }
        registrars:
          description: Каси, зареєстровані в ДПС за цією господарською одиницею.
          type: array
          items: { $ref: "#/components/schemas/DPSRegistrar" }

    DPSRegistrar:
      type: object
      description: Каса, зареєстрована в ДПС за господарською одиницею.
      required: [fiscal_number, local_number]
      properties:
        fiscal_number: { type: string, description: "Фіскальний номер каси, який присвоїла ДПС." }
        local_number: { type: string, description: "Локальний номер каси, який присвоїв власник." }
        name: { type: string, description: "Назва каси з реєстраційних даних ДПС." }
        closed: { type: boolean, description: "Касу скасовано в ДПС." }

    KeyPasswordCheckResult:
      type: object
      description: >-
        Результат швидкої перевірки пароля контейнера. Сервіс лише розшифровує
        контейнер і не надсилає запитів у мережу.


        Завдання завершується успішно і при ok = false, тому що перевірка
        дала результат. Якщо сталася внутрішня помилка, результату немає, і
        сервіс повторює завдання.
      required: [signing_key_id, ok]
      properties:
        signing_key_id:
          type: string
          format: uuid
          description: Ключ, пароль якого перевіряли.
        ok: { type: boolean, description: "Пароль правильний: сервіс розшифрував контейнер." }
        verify_code:
          type: string
          description: >-
            Код причини. Поле є завжди при ok = false. Приклад: wrong_password.
        verify_error: { type: string, description: "Текст помилки бібліотеки підпису без змін." }

    KeyVerificationResult:
      description: >-
        Результат повної перевірки ключа КЕП: чи можна підписувати ключем
        документи каси і хто власник ключа.
      type: object
      required: [signing_key_id, status, prro_capable]
      properties:
        signing_key_id:
          type: string
          format: uuid
          description: >-
            Ключ, який перевіряли. Якщо deleted = true, ключа в сервісі вже
            немає.
        status:
          type: string
          enum: [active, invalid]
          description: |-
            - `active` — ключ можна використовувати
            - `invalid` — сервіс відхилив ключ, причина в verify_code
        verify_code:
          type: string
          enum: [wrong_password, cert_not_found, cert_expired, not_prro, verify_failed, ca_unreachable]
          description: >-
            Причина відхилення. Ключ із причиною not_prro можна активувати
            через POST /cabinet/signing-keys/{id}/activate.
        verify_error: { type: string, description: "Текст помилки перевірки без змін." }
        key_type:
          type: string
          enum: [individual, legal]
          description: >-
            Тип власника ключа за даними сертифіката.
        prro_capable:
          type: boolean
          description: Сертифікат дозволяє підписувати документи каси.
        cert_subject: { type: string, description: "Поле subject сертифіката, як його записав АЦСК." }
        org_name:
          type: string
          description: >-
            Назва суб'єкта господарювання або ім'я фізичної особи з
            сертифіката.
        edrpou:
          type: string
          description: ЄДРПОУ юридичної особи з сертифіката, лише цифри.
        drfo:
          type: string
          description: РНОКПП (ДРФО) фізичної особи з сертифіката, лише цифри.
        deleted:
          type: boolean
          description: >-
            Сервіс видалив ключ. Сервіс видаляє ключ за будь-якої причини
            відхилення, крім not_prro.
    DocResult:
      description: >-
        Документ, який створило завдання: номери в сервісі і в ДПС, посилання
        для покупця.
      type: object
      required: [document_id, local_number, fiscal_number, register_fiscal_number]
      properties:
        document_id:
          type: string
          format: uuid
          description: Ідентифікатор документа в журналі сервісу.
        local_number:
          type: integer
          description: Наскрізний номер документа в межах каси (ORDERNUM).
        fiscal_number: { type: string, description: "Фіскальний номер документа, який присвоїла ДПС." }
        register_fiscal_number:
          type: string
          description: >-
            Фіскальний номер каси, у якій сервіс створив документ. У чеку це
            «ФН ПРРО» (CASHREGISTERNUM). Це номер каси, а не документа. На
            відміну від fiscal_number, цей номер однаковий в онлайн-режимі і в
            офлайн-сесії. Поле є завжди.
        offline:
          type: boolean
          description: >-
            Сервіс підписав документ в офлайн-сесії. Сервіс обчислив
            фіскальний номер локально (<sid>.<n>.<crc>). ДПС отримає документ
            лише разом із пакетом офлайн-сесії.
        receipt_url:
          type: string
          format: uri
          description: |-
            Копія чека для покупця на короткому домені сервісу
            (https://r.prro.cloud/<код>). Посилання надсилають покупцю або
            перетворюють на QR-код. Сторінка відкривається без авторизації:
            доступ дає код у посиланні.

            Формат задає параметр запиту ?format=:

            - `html` (типовий) — сторінка чека
            - `png` — зображення чека шириною 576 px (стрічка 80 мм для
              термопринтера) з QR-кодом
            - `qr` — PNG із QR-кодом адреси цієї сторінки

            Поле є лише в чеках. Посилання працює одразу, також в
            офлайн-сесії. Сторінка — копія чека, а не підтвердження
            фіскалізації. Підтвердження фіскалізації: fiscal_number і tax_url.
        tax_url:
          type: string
          format: uri
          description: >-
            Цей документ в Електронному кабінеті платника податків ДПС. Це
            незалежне підтвердження фіскалізації. Поля немає, доки ДПС не
            отримала документ. До надсилання пакета офлайн-сесії офлайн-чек має
            лише фіскальний номер, який сервіс обчислив локально.
        original: { $ref: "#/components/schemas/ReturnOriginal" }
        totals: { $ref: "#/components/schemas/ZReportTotals" }

    ReturnOriginal:
      description: >-
        Початковий чек повернення. Поле є лише в чеку повернення.
      type: object
      required: [fiscal_number, verified]
      properties:
        fiscal_number: { type: string, description: "Фіскальний номер початкового чека." }
        document_id:
          type: string
          format: uuid
          description: >-
            Початковий чек у журналі сервісу. Поля немає, якщо verified = false.
        verified:
          type: boolean
          description: >-
            true: сервіс створив початковий чек і перевірив повернення за
            залишком цього чека. false: початкового чека в сервісі немає, його
            створила інша каса. Сервіс прийняв повернення без перевірки.

    # The shapes are split rather than merged into one struct with optional
    # fields because a cross-field rule can say "items are required" but not
    # "required for two kinds and forbidden for three", and the forbidding is
    # the part that matters.
    #
    # Storno got a shape of its own in 0.7.0. It used to share the settlement
    # one, items and payments included, and the fiscal server refused every
    # such storno (error 9, «Сторнуючий документ не може містити ненульову
    # суму»), so no client ever had one registered — nothing that worked
    # before stops working, hence a minor bump.
    ReceiptInput:
      description: |-
        Три форми запиту на чек. Форму визначає поле `type`:

        - продаж і повернення — позиції та оплати
        - сторно — лише посилання на чек
        - службове внесення і службова видача — лише сума

        Сервіс не ігнорує поля іншої форми. Для таких полів сервіс повертає
        422.
      oneOf:
        - $ref: "#/components/schemas/SettlementReceiptInput"
        - $ref: "#/components/schemas/StornoReceiptInput"
        - $ref: "#/components/schemas/ServiceReceiptInput"
      discriminator:
        propertyName: type
        mapping:
          sale: "#/components/schemas/SettlementReceiptInput"
          return: "#/components/schemas/SettlementReceiptInput"
          storno: "#/components/schemas/StornoReceiptInput"
          service_in: "#/components/schemas/ServiceReceiptInput"
          service_out: "#/components/schemas/ServiceReceiptInput"

    SettlementReceiptInput:
      type: object
      description: Чек продажу або повернення товарів.
      required: [type, items, payments]
      properties:
        cash_register_id:
          type: string
          format: uuid
          description: >-
            Каса, на якій сервіс реєструє чек. Поле обов'язкове для POST
            /v1/receipts. Якщо URL маршруту вже містить касу, поле має
            збігатися з цією касою або поля немає. Інакше сервіс повертає 422.
        type:
          type: string
          enum: [sale, return]
          description: |-
            - `sale` — продаж
            - `return` — повернення
        cashier:
          type: string
          description: >-
            Ім'я касира, яке сервіс друкує в чеку (CASHIER). Якщо поля немає,
            чек не містить цього рядка.
        comment:
          type: string
          description: >-
            Довільна примітка, яку сервіс друкує в чеку (CHECKHEAD/COMMENT).
            Приклад: номер замовлення.
        sold_at:
          type: string
          format: date-time
          description: >-
            Час фактичного продажу, якщо чек надійшов до сервісу пізніше. Це
            не фіскальний час чека. ДПС приймає ORDERDATE/ORDERTIME лише в
            межах приблизно однієї хвилини від свого часу. Тому фіскальний час
            чека — час надсилання. Сервіс друкує в чеку рядок «Продаж від
            03.09.2026 18:11» перед приміткою з `comment`.


            Для часу в майбутньому або часу, старшого за 31 день, сервіс
            повертає 422.
        mode:
          type: string
          enum: [sync, async]
          default: sync
          description: >-
            Режим відповіді. Параметр запиту ?mode= має пріоритет над цим
            полем.
        # The cap is enforced by the worker, not at the request: the fiscal
        # server accepts any return, and an over-return lowers the declared
        # turnover. Summed before cash rounding so a rounded cash sale can be
        # given back by card in full.
        original:
          type: object
          description: |-
            Посилання на початковий чек. Поле обов'язкове для повернення.

            Якщо сервіс створив початковий чек, сервіс перевіряє повернення
            за цим чеком. Початковий чек має відповідати всім умовам:

            - це чек продажу
            - режим чека той самий: тестовий або фіскальний
            - сторно не скасовувало цей чек
            - сума всіх повернень за чеком не перевищує суми продажу до
              заокруглення

            Якщо умову не виконано, завдання завершується помилкою з кодом
            return.*, і сервіс не реєструє чек. Якщо початкового чека в
            сервісі немає, сервіс приймає повернення без перевірки. Див.
            result.receipt.original.verified.
          required: [fiscal_number]
          properties:
            fiscal_number: { type: string, description: "Фіскальний номер початкового чека." }
            register_fiscal_number:
              type: string
              description: >-
                Фіскальний номер каси, у якій створено початковий чек, якщо це
                інша каса. Якщо поля немає, сервіс шукає початковий чек на касі
                повернення.
            date: { type: string, format: date, description: "Дата початкового чека у форматі РРРР-ММ-ДД." }
        items:
          description: Позиції чека, щонайменше одна.
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReceiptItem" }
        payments:
          description: Оплати чека, щонайменше одна.
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReceiptPayment" }
        rounding_step:
          type: string
          description: >-
            Крок заокруглення готівки, десятковий рядок ("0.10" за правилами
            НБУ). Якщо поля немає, сервіс не заокруглює суму.
    # The storno rules mirror the fiscal server's — it cancels the register's
    # last document only (error 9, «Сторнуватись може лише останній
    # документ», live 2026-10-20) — plus what keeps the service's own totals
    # honest: a storno states no amount, so the shift totals and the drawer
    # move by the original's figures, which only a journaled check supplies.
    StornoReceiptInput:
      type: object
      description: >-
        Сторно попереднього чека (DOCSUBTYPE 5). Сторно скасовує чек продажу
        або повернення, який зареєстрували помилково. Сторно не містить
        позицій, оплат і суми. ДПС реєструє сторно з нульовою сумою.


        Сторно може скасувати лише останній документ каси. Цей документ має
        бути чеком продажу або повернення, який створив сервіс і який сторно
        ще не скасовувало. Інакше завдання завершується помилкою з кодом
        storno.*, і сервіс не реєструє сторно. Щоб скасувати чек, після якого
        є інші документи, зареєструйте повернення.


        Сервіс змінює підсумки зміни і залишок готівки на суми скасованого
        чека у зворотному напрямку.
      required: [type, original]
      properties:
        cash_register_id:
          type: string
          format: uuid
          description: >-
            Каса, на якій сервіс реєструє чек. Поле обов'язкове для POST
            /v1/receipts. Якщо URL маршруту вже містить касу, поле має
            збігатися з цією касою або поля немає. Інакше сервіс повертає 422.
        type:
          type: string
          enum: [storno]
        cashier:
          type: string
          description: >-
            Ім'я касира, яке сервіс друкує в чеку (CASHIER). Якщо поля немає,
            чек не містить цього рядка.
        comment:
          type: string
          description: >-
            Довільна примітка, яку сервіс друкує в чеку (CHECKHEAD/COMMENT).
            Приклад: причина сторно.
        mode:
          type: string
          enum: [sync, async]
          default: sync
          description: >-
            Режим відповіді. Параметр запиту ?mode= має пріоритет над цим
            полем.
        original:
          type: object
          description: Чек, який скасовує сторно.
          required: [fiscal_number]
          properties:
            fiscal_number: { type: string, description: "Фіскальний номер чека, який скасовує сторно." }
    ServiceReceiptInput:
      type: object
      description: |-
        Рух готівки без продажу:

        - `service_in` — службове внесення (DOCSUBTYPE 2)
        - `service_out` — службова видача (DOCSUBTYPE 4)

        Сервіс обробляє цей чек так само, як інші чеки. В автоматичному
        режимі змін чек відкриває зміну. Чек працює в офлайн-сесії. Сервіс
        записує чек у журнал і тарифікує його як чек. У підсумках зміни сума
        входить окремо в service_input/service_output і в ZREPBODY Z-звіту.
        Сервіс змінює cash_balance на всю суму.

        Сервіс не підтримує отримання підкріплення (DOCSUBTYPE 3).
      required: [type, sum]
      properties:
        cash_register_id:
          type: string
          format: uuid
          description: >-
            Каса, на якій сервіс реєструє чек. Поле обов'язкове для POST
            /v1/receipts. Якщо URL маршруту вже містить касу, поле має
            збігатися з цією касою або поля немає. Інакше сервіс повертає 422.
        type:
          type: string
          enum: [service_in, service_out]
          description: |-
            - `service_in` — службове внесення
            - `service_out` — службова видача
        cashier:
          type: string
          description: >-
            Ім'я касира, яке сервіс друкує в чеку (CASHIER). Якщо поля немає,
            чек не містить цього рядка.
        comment:
          type: string
          description: >-
            Довільна примітка, яку сервіс друкує в чеку (CHECKHEAD/COMMENT).
            Для руху готівки лише примітка вказує призначення суми. Приклади:
            «Інкасація», «Розмінна монета».
        sold_at:
          type: string
          format: date-time
          description: >-
            Час фактичного продажу, якщо чек надійшов до сервісу пізніше. Це
            не фіскальний час чека. ДПС приймає ORDERDATE/ORDERTIME лише в
            межах приблизно однієї хвилини від свого часу. Тому фіскальний час
            чека — час надсилання. Сервіс друкує в чеку рядок «Продаж від
            03.09.2026 18:11» перед приміткою з `comment`.


            Для часу в майбутньому або часу, старшого за 31 день, сервіс
            повертає 422.
        mode:
          type: string
          enum: [sync, async]
          default: sync
          description: >-
            Режим відповіді. Параметр запиту ?mode= має пріоритет над цим
            полем.
        sum:
          type: string
          description: >-
            Сума руху готівки: додатний десятковий рядок, до 2 знаків після
            коми. Чек не містить позицій.
          examples: ["1500.00"]

    ReceiptItem:
      type: object
      description: >-
        Грошові значення — десяткові рядки ("259.90"). Кількість має до 3
        знаків після коми, ціна — до 2.
      required: [name, quantity, price]
      properties:
        code: { type: string, description: "Внутрішній код товару." }
        barcode: { type: string, description: "Штрихкод товару." }
        uktzed: { type: string, description: "Код УКТЗЕД. Не використовуйте разом із dkpp." }
        dkpp: { type: string, description: "Код ДКПП. Не використовуйте разом із uktzed." }
        name: { type: string, description: "Назва позиції, яку сервіс друкує в чеку." }
        unit_code: { type: integer, description: "Код одиниці виміру (UNITCD)." }
        unit_name: { type: string, description: "Назва одиниці виміру. Приклади: «шт», «кг»." }
        quantity:
          type: string
          examples: ["1", "0.750"]
          description: Кількість, десятковий рядок, до 3 знаків після коми.
        price:
          type: string
          examples: ["259.90"]
          description: Ціна за одиницю, десятковий рядок, до 2 знаків після коми.
        tax_letters:
          type: string
          description: >-
            Податкові літери з tax_rates каси. Приклади: "А", "АГ". Порожнє
            значення застосовує default_tax_letter каси. Якщо типової літери
            немає, позиція не має податку. Значення "-" робить позицію
            неоподатковуваною.
        discount:
          description: Знижка на позицію.
          type: object
          required: [sum]
          properties:
            percent: { type: string, description: "Позначає знижку як відсоткову. Суму знижки вказують у sum." }
            sum:
              type: string
              description: >-
                Сума знижки, десятковий рядок. Поле обов'язкове також для
                відсоткової знижки.
        excise_labels:
          type: array
          items: { type: string }
          description: Коди акцизних марок.
        comment: { type: string, description: "Примітка до позиції." }

    # Why one field and not the DPS pair PAYFORMCD/PAYFORMNM: carrying the
    # code and the name separately lets a caller send code 0 (cash) named
    # "КАРТКА" — the check prints a card payment while the drawer counter
    # records cash. The enum makes the pair underivable-from-outside, and the
    # single mapping table lives in server/internal/fiscal/payform.go.
    PaymentType:
      type: string
      enum: [cash, card, certificate, bank_transfer, direct_debit]
      description: |-
        Форма оплати. Фіскальний код і назву форми оплати в чеку визначає
        сервіс:

        - `cash` — 0 ГОТІВКА
        - `card` — 301 КАРТКА
        - `certificate` — 305 СЕРТИФІКАТ
        - `bank_transfer` — 306 ПЕРЕКАЗ З ПОТОЧНОГО РАХУНКУ
        - `direct_debit` — 100000 ПРЯМИЙ ДЕБЕТ

        Залишок готівки каси змінює лише `cash`.
    ReceiptPayment:
      description: >-
        Одна оплата чека: форма оплати, сума і, для картки, реквізити
        еквайрингу.
      type: object
      required: [type, sum]
      properties:
        type: { $ref: "#/components/schemas/PaymentType" }
        sum: { type: string, description: "Сума цієї оплати." }
        provided: { type: string, description: "Сума, яку покупець дав готівкою. Решта = provided − sum." }
        means:
          type: string
          maxLength: 128
          description: >-
            Засіб оплати: чим саме покупець оплатив. Положення № 13 (розд. II
            п. 2, рядок 19) вимагає вказувати засіб оплати окремо від форми
            оплати.


            Значення — ті самі, що в прикладах ДПС: «Картка», «Переказ з
            поточного рахунку», «Подарунковий сертифікат», «Попередня оплата»,
            «Прямий дебет». Також значення, яких немає в `type`: «ПЕРЕКАЗ З
            КАРТКИ», «ТАЛОН», «ЖЕТОН».


            Поле замінює лише назву форми оплати, яку сервіс друкує
            (PAYFORMNM). Фіскальний код форми оплати (PAYFORMCD) визначає
            `type`. Для `cash` сервіс не приймає це поле.
        card:
          type: object
          description: >-
            Реквізити еквайрингу (рядки 12–17). Усі три поля `acquirer_*`
            описують еквайра торговця, а не торговця.
          properties:
            system_name: { type: string, description: "Назва платіжної системи (рядок 17)." }
            acquirer_id: { type: string, maxLength: 128, description: "Ідентифікатор еквайра (рядок 12)." }
            acquirer_tax_id: { type: string, maxLength: 128, description: "Податковий номер еквайра (рядок 12)." }
            acquirer_name: { type: string, description: "Назва еквайра (рядок 12)." }
            transaction_date:
              type: string
              format: date-time
              description: Дата й час транзакції на платіжному пристрої (POSTRANSDATE).
            transaction_number:
              type: string
              description: Номер транзакції на платіжному пристрої (POSTRANSNUM).
            device_id: { type: string, description: "Ідентифікатор платіжного пристрою (рядок 13)." }
            epz_details: { type: string, description: "Замаскований номер картки." }
            auth_code: { type: string, description: "Код авторизації (рядок 17)." }
            commission:
              type: string
              description: >-
                Сума комісії еквайра за цією оплатою: рядок 14 форми ФКЧ-1, «у
                разі наявності».


                Для звичайного продажу поле порожнє. Поле заповнюють, лише коли
                комісію сплачує держатель картки: приймання коштів для
                подальшого переказу і видача готівки держателям карток
                (розділи VI і VII Положення № 13).


                Нуль означає, що комісії немає. Тоді сервіс не друкує рядок 14.
    WebhookEvent:
      type: string
      enum:
        - task.completed
        - task.failed
        - shift.opened
        - shift.closed
        - key.expiring
        - register.offline
        - register.online
        - register.offline_limit
        - register.offline_abandoned
        - register.remediated
        - register.needs_attention
        - client.balance_low
        - receipt.registered
      description: |-
        - `task.completed` — завдання завершилося успішно.
        - `task.failed` — завдання завершилося помилкою.
        - `shift.opened`, `shift.closed` — зміну відкрито або закрито. Дані:
          ShiftEventData.
        - `key.expiring` — строк дії сертифіката ключа закінчується протягом
          30 днів. Сервіс надсилає цю подію раз на добу.
        - `register.offline` — каса перейшла в офлайн-режим.
        - `register.online` — каса повернулася в онлайн-режим.
        - `register.offline_limit` — каса досягла законодавчої межі
          офлайн-режиму (36 годин на офлайн-сесію, 168 годин на місяць).
          Якщо межі знято, дані містять `limits_lifted: true`, і сервіс не
          відхиляє документи через межі.
        - `register.offline_abandoned` — від офлайн-сесії відмовилися. Подія
          містить перелік документів, яких ДПС не отримала.
        - `register.remediated` — сервіс автоматично виправив розбіжність із
          ДПС.
        - `register.needs_attention` — сервіс не може виправити розбіжності
          автоматично. Потрібне рішення людини.
        - `client.balance_low` — баланс наближається до порога. Коли баланс
          стане нижчим за поріг, сервіс відхилятиме чеки з 402.
        - `receipt.registered` — сервіс зареєстрував чек будь-якого типу.
          Подія містить повний вміст чека. Дані: ReceiptRegisteredData.

    ShiftEventData:
      description: Дані подій shift.opened і shift.closed.
      type: object
      required: [cash_register_id, shift_id, task_id, testing]
      properties:
        cash_register_id: { type: string, format: uuid, description: "Каса." }
        shift_id: { type: string, format: uuid, description: "Зміна." }
        task_id:
          type: string
          format: uuid
          description: >-
            Завдання, яке відкрило або закрило зміну. Зазвичай це завдання
            open_shift або close_shift. Зміну також може закрити завдання
            receipt, якщо попереднє закриття не завершилося, або автоматичне
            виправлення розбіжності з ДПС.
        testing: { type: boolean, description: "Тестова зміна: каса в тестовому режимі." }
        zreport:
          $ref: "#/components/schemas/DocResult"
          description: >-
            Поле є лише в shift.closed. Z-звіт, яким сервіс закрив зміну,
            разом із підсумками (totals). Якщо зміну закрило завдання
            close_shift, це той самий об'єкт, що в result.zreport цього
            завдання.


            Поля немає, якщо в сервісі немає Z-звіту цієї зміни.

    ReceiptRegisteredData:
      description: >-
        Дані події receipt.registered: чек у тому вигляді, у якому його
        отримала ДПС. Суми — десяткові рядки в гривнях, як у запиті на чек.
      type: object
      required: [cash_register_id, register_fiscal_number, document_id, task_id, type,
        source, local_number, fiscal_number, offline, testing, shift_id, issued_at, total]
      properties:
        cash_register_id: { type: string, format: uuid, description: "Каса." }
        register_fiscal_number: { type: string, description: "Фіскальний номер каси." }
        document_id: { type: string, format: uuid, description: "Чек у журналі сервісу." }
        task_id: { type: string, format: uuid, description: "Завдання, яке зареєструвало чек." }
        type:
          type: string
          enum: [sale, return, storno, service_in, service_out]
          description: Тип чека.
        source:
          type: string
          enum: [api, cabinet]
          description: Джерело запиту на чек — API або кабінет.
        user_id:
          type: string
          format: uuid
          description: >-
            Обліковий запис кабінету, з якого надіслано запит на чек. Поле є
            лише для source = cabinet. Власник бачить цей обліковий запис у
            переліку команди.
        cashier: { type: string, description: "Ім'я касира, надруковане в чеку." }
        local_number: { type: integer, format: int64, description: "Локальний номер чека." }
        fiscal_number:
          type: string
          description: >-
            Фіскальний номер чека. В офлайн-сесії сервіс обчислює номер
            локально.
        offline: { type: boolean, description: "Сервіс створив чек в офлайн-сесії." }
        testing: { type: boolean, description: "Тестовий чек." }
        shift_id: { type: string, format: uuid, description: "Зміна." }
        shift_number: { type: integer, format: int64, description: "Номер зміни в межах каси." }
        issued_at:
          type: string
          format: date-time
          description: Дата й час чека, як їх надруковано.
        total:
          type: string
          description: >-
            Сума до сплати. Для службового внесення і службової видачі — сума
            руху готівки. Для сторно — 0.00.
        rounding: { type: string, description: "Сума заокруглення готівки. Поля немає, якщо заокруглення не було." }
        items:
          type: array
          description: Позиції чека.
          items:
            type: object
            required: [name, quantity, price]
            properties:
              code: { type: string }
              barcode: { type: string }
              uktzed: { type: string }
              dkpp: { type: string }
              name: { type: string }
              unit_name: { type: string }
              quantity: { type: string }
              price: { type: string }
              cost: { type: string, description: "Вартість позиції до знижки." }
              tax_letters: { type: string }
              discount: { type: string, description: "Сума знижки." }
        payments:
          type: array
          description: Оплати чека.
          items:
            type: object
            required: [name, sum]
            properties:
              type: { type: string, description: "Форма оплати, як у запиті на чек." }
              name: { type: string, description: "Назва форми оплати, надрукована в чеку." }
              sum: { type: string }
        taxes:
          type: array
          description: Податки чека.
          items: { $ref: "#/components/schemas/TaxTotal" }
        comment: { type: string, description: "Примітка, надрукована в чеку." }
        original:
          type: object
          description: Початковий чек повернення або чек, який скасовує сторно.
          required: [fiscal_number, verified]
          properties:
            fiscal_number: { type: string }
            document_id: { type: string, format: uuid, description: "Початковий чек у журналі сервісу. Поля немає, якщо чека немає в журналі." }
            verified: { type: boolean, description: "Лише для повернення: сервіс знайшов початковий чек у журналі і перевірив залишок за ним." }
        receipt_url: { type: string, description: "Копія чека для покупця." }
        tax_url:
          type: string
          description: >-
            Чек в Електронному кабінеті платника податків ДПС. Поля немає, доки
            ДПС не отримала офлайн-чек.

    WebhookEndpoint:
      description: >-
        Вебхук: URL приймача і події, які сервіс доставляє.
      type: object
      required: [id, url, events, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: "Ідентифікатор вебхука." }
        url: { type: string, description: "Абсолютний http(s)-URL приймача." }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
          description: Порожній список означає підписку на всі події.
        active:
          type: boolean
          description: >-
            Доставка ввімкнена. false: сервіс призупиняє доставку, черга
            доставок зберігається.
        created_at: { type: string, format: date-time, description: "Час створення вебхука." }
        updated_at:
          type: string
          format: date-time
          description: Час останньої зміни вебхука.

    WebhookDelivery:
      description: >-
        Одна доставка події та її статус.
      type: object
      required: [id, event, status, attempts, created_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: Ідентифікатор доставки. Це значення вказують у шляху replay.
        event:
          type: string
          description: >-
            Тип події. Крім значень WebhookEvent, доставка може мати
            зарезервовані типи без підписки: webhook.ping (тестова доставка) і
            system.dps_* (події доступності ДПС).
        status:
          type: string
          enum: [pending, delivering, delivered, failed, dead]
          description: |-
            - `pending` — доставка в черзі
            - `delivering` — спроба виконується
            - `delivered` — подію доставлено
            - `failed` — спроба невдала, сервіс виконає повторну спробу
            - `dead` — спроби закінчилися
        attempts: { type: integer, description: "Кількість виконаних спроб." }
        cash_register_id:
          type: string
          format: uuid
          description: Каса події. Поля немає для подій рівня клієнта.
        sequence:
          type: integer
          format: int64
          description: >-
            Номер події в межах каси (поле sequence конверта). За цим номером
            упорядковують події. Поля немає для подій рівня клієнта.
        data: { description: "Дані події (поле data конверта)." }
        last_error: { type: string, description: "Результат останньої невдалої спроби: код і початок відповіді приймача або причина помилки з'єднання (наприклад, TLS)." }
        next_attempt_at:
          type: string
          format: date-time
          description: Час наступної спроби. Поля немає, якщо спроб більше не буде.
        created_at:
          type: string
          format: date-time
          description: Час, коли сервіс поставив подію в чергу.
        delivered_at:
          type: string
          format: date-time
          description: Час, коли приймач повернув успішну відповідь.

    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,4})?$'
      description: >-
        Копійки, десятковий рядок (numeric(14,4)). Ніколи не число з рухомою
        комою.
    CashAmount:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: >-
        Гривні з копійками, десятковий рядок. Формат той самий, що в сумах
        чека. Тип Money рахує копійки, його використовує лише тарифікація.
      examples: ["1500.00", "-12.30"]

    CashBalance:
      type: object
      description: |-
        Залишок готівки в касі. Це не фіскальне значення. Залишок готівки
        дорівнює нулю, коли касу створено. Залишок готівки враховує лише
        документи, які пройшли через цей сервіс.

        Залишок готівки змінюють:

        - готівкові оплати: продаж додає суму, повернення віднімає суму,
          сторно скасовує зміну від скасованого чека
        - службове внесення і службова видача

        Безготівкові оплати не змінюють залишок готівки. Сервіс бере `sum`
        оплати, решту вже враховано. Залишок готівки належить касі, а не
        зміні. Z-звіт не скидає залишок готівки.

        Від'ємне значення означає, що в касі було більше готівки, ніж
        зареєстрував сервіс. Встановити залишок готівки: PUT
        /v1/cash-registers/{id}/cash-balance.
      required: [amount]
      properties:
        amount: { $ref: "#/components/schemas/CashAmount" }
        as_of:
          type: string
          format: date-time
          nullable: true
          description: >-
            Час останньої зміни залишку готівки. null: змін ще не було. Тоді
            нуль означає «немає даних», а не «каса порожня».
    ShiftTotalsSide:
      type: object
      description: >-
        Продажі або повернення: кількість чеків, сума і суми за формами
        оплати.
      required: [count, sum]
      properties:
        count:
          type: integer
          description: Кількість чеків.
        sum: { $ref: "#/components/schemas/CashAmount" }
        pay_forms:
          type: array
          description: >-
            Суми за формами оплати. code і name — код і назва форми оплати, як
            у Z-звіті (PAYFORMCD і PAYFORMNM). Поля немає, якщо чеків немає.
          items:
            type: object
            required: [code, name, sum]
            properties:
              code: { type: integer, description: "PAYFORMCD: фіскальний код форми оплати." }
              name: { type: string, description: "PAYFORMNM: назва форми оплати, яку сервіс друкує." }
              sum: { $ref: "#/components/schemas/CashAmount" }

    ShiftTotals:
      type: object
      description: >-
        Підсумки відкритої зміни на поточний момент. З цих сум сервіс створить
        Z-звіт під час закриття зміни. realiz — продажі, return — повернення.


        Скасовані чеки не входять у підсумки. Сервіс віднімає скасований чек
        із продажів або повернень. Службові внесення і службові видачі
        входять окремо: у service_in і service_out.


        Сум за податками тут немає. Суми за податками є в підсумках Z-звіту
        (ZReportTotals) після закриття зміни.
      required: [realiz, return, service_in, service_out]
      properties:
        realiz: { $ref: "#/components/schemas/ShiftTotalsSide" }
        return: { $ref: "#/components/schemas/ShiftTotalsSide" }
        service_in: { $ref: "#/components/schemas/CashAmount" }
        service_out: { $ref: "#/components/schemas/CashAmount" }

    TaxTotal:
      type: object
      description: "Податок за однією ставкою: оборот і сума податку."
      required: [name, rate, turnover, sum]
      properties:
        letter: { type: string, description: "Податкова літера. Приклад: «А»." }
        name: { type: string, description: "Назва податку. Приклад: «ПДВ»." }
        rate: { type: string, description: "Ставка у відсотках. Приклад: «20.00»." }
        turnover: { type: string, description: "Оборот: сума продажів за цією ставкою." }
        sum: { type: string, description: "Сума податку." }
        excluded: { type: boolean, description: "true: сервіс додав податок до ціни, податок не входить у ціну." }

    ZReportTotalsSide:
      description: >-
        Продажі або повернення за зміну: кількість чеків, сума, суми за
        формами оплати і за податками.
      allOf:
        - $ref: "#/components/schemas/ShiftTotalsSide"
        - type: object
          properties:
            taxes:
              type: array
              description: Податки за ставками. Поля немає, якщо податків не було.
              items: { $ref: "#/components/schemas/TaxTotal" }

    ZReportTotals:
      type: object
      description: >-
        Підсумки Z-звіту: ті самі суми, що в документі, який сервіс надіслав
        до ДПС. Поле є лише в Z-звіті. realiz — продажі, return — повернення.


        Якщо в зміні не було повернень, службових внесень або службових
        видач, відповідні суми дорівнюють нулю.


        Z-звіт, який сервіс створив в офлайн-сесії (offline: true), ДПС
        отримує пізніше, разом з іншими документами офлайн-сесії.
      required: [realiz, return, service_in, service_out]
      properties:
        realiz: { $ref: "#/components/schemas/ZReportTotalsSide" }
        return: { $ref: "#/components/schemas/ZReportTotalsSide" }
        service_in: { $ref: "#/components/schemas/CashAmount" }
        service_out: { $ref: "#/components/schemas/CashAmount" }

    CashBalanceDeclaration:
      type: object
      description: >-
        Залишок готівки до заяви, після заяви і різниця між ними.
      required: [amount, previous, adjustment]
      properties:
        amount: { $ref: "#/components/schemas/CashAmount" }
        previous: { $ref: "#/components/schemas/CashAmount" }
        adjustment: { $ref: "#/components/schemas/CashAmount" }

    BillingUsage:
      description: Баланс і підсумок тарифікації за період.
      type: object
      required: [balance, soft_limit, blocked, period, receipts, charged, tariff]
      properties:
        balance: { $ref: "#/components/schemas/Money" }
        soft_limit:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            Поріг балансу. Поки balance < soft_limit, сервіс відхиляє чеки.
        blocked:
          type: boolean
          description: >-
            Сервіс зараз відхиляє чеки через баланс або за рішенням оператора.
        period:
          description: Період підсумку.
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date, description: "Дата входить у період." }
            to: { type: string, format: date, description: "Дата не входить у період." }
        receipts: { type: integer, format: int64, description: "Кількість тарифікованих чеків за період." }
        charged: { $ref: "#/components/schemas/Money" }
        tariff:
          description: Тариф, за яким сервіс тарифікував чеки.
          type: object
          required: [plan_id, price_per_receipt]
          properties:
            plan_id: { type: string, format: uuid, description: "Ідентифікатор тарифного плану." }
            price_per_receipt: { $ref: "#/components/schemas/Money" }

    Invoice:
      description: Рахунок за один розрахунковий період.
      type: object
      required: [id, period_start, period_end, amount, currency, status, created_at]
      properties:
        id: { type: string, format: uuid, description: "Ідентифікатор рахунка." }
        period_start: { type: string, format: date, description: "Дата входить у період." }
        period_end: { type: string, format: date, description: "Дата входить у період." }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, description: "Валюта рахунка за ISO 4217: UAH." }
        status:
          type: string
          enum: [draft, issued, paid, overdue]
          description: |-
            - `draft` — чернетка
            - `issued` — рахунок виставлено
            - `paid` — рахунок оплачено
            - `overdue` — рахунок прострочено
        created_at: { type: string, format: date-time, description: "Час створення рахунка." }

    DPSPulse:
      type: object
      description: >-
        Режим роботи з ДПС і телеметрія, яка пояснює цей режим. Сервіс
        працює з ДПС за значенням effective.
      required: [effective, verdict, since, latency_ms, samples, failures, tunables]
      properties:
        effective:
          type: string
          enum: [online, offline]
          description: Поточний режим роботи сервісу з ДПС.
        verdict:
          type: string
          enum: [online, degraded, offline]
          description: >-
            Результат детектора. Значення degraded означає «повільно», offline
            — «недоступно».
        since:
          type: string
          format: date-time
          description: Час, з якого діє поточне значення effective.
        latency_ms:
          type: integer
          format: int64
          description: >-
            Затримка успішних запитів у вікні детектора, у мілісекундах.
            Значення 0 означає, що у вікні немає успішних запитів.
        samples: { type: integer, description: "Кількість запитів у вікні детектора." }
        failures: { type: integer, description: "Кількість невдалих запитів у вікні детектора." }
        last_ok_at:
          type: string
          format: date-time
          description: Час останньої успішної відповіді ДПС.
        last_probe_at:
          type: string
          format: date-time
          description: Час останньої перевірки доступності ДПС.
        tunables:
          type: object
          description: >-
            Пороги для значень вище: ширина вікна детектора, поріг degraded і
            інтервал перевірок.
          required: [window_seconds, degraded_latency_ms, probe_interval_seconds]
          properties:
            window_seconds:
              type: integer
              format: int64
              description: Ширина вікна детектора, у секундах.
            degraded_latency_ms:
              type: integer
              format: int64
              description: Затримка, від якої відповідь вважається повільною, у мілісекундах.
            probe_interval_seconds:
              type: integer
              format: int64
              description: Інтервал перевірок, у секундах.
